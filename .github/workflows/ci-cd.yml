name: CI-CD

on:
    push:
        branches: [master]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@6
              with:
                  python-version: '3.11'
            - run: python -m pip install --upgrade pip
            - run: pip install -r requirements.txt  
            - run: python -m pytest -q
